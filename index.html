<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clima e Qualidade do Ar no Parque</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f1f5f9;
            color: #333;
            margin: 0;
            padding: 0;
            text-align: center;
        }
        header {
            background: #2563eb;
            color: white;
            padding: 20px;
            font-size: 22px;
            font-weight: bold;
        }
        .container {
            padding: 20px;
        }
        .sensor-box {
            background: white;
            padding: 20px;
            margin: 15px auto;
            width: 85%;
            max-width: 400px;
            border-radius: 12px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.15);
            font-size: 18px;
        }
        .recommendation {
            margin-top: 20px;
            padding: 20px;
            border-radius: 12px;
            width: 85%;
            max-width: 450px;
            margin-left: auto;
            margin-right: auto;
            font-size: 18px;
            color: white;
        }
        .good {
            background: #16a34a;
        }
        .warning {
            background: #dc2626;
        }
        .rec-icon {
            font-size: 26px;
            margin-right: 10px;
        }
        footer {
            background: #1e3a8a;
            color: white;
            padding: 10px;
            margin-top: 30px;
        }
    </style>
</head>

<body>

<header>
    Monitoramento do Parque — Clima e Qualidade do Ar
</header>

<div class="container">

    <div class="sensor-box">
        🌡️ <strong>Temperatura:</strong> <span id="temp-value">--</span> °C
    </div>

    <div class="sensor-box">
        💧 <strong>Umidade:</strong> <span id="hum-value">--</span> %
    </div>

    <div class="sensor-box">
        ☀️ <strong>Índice UV:</strong> <span id="uv-value">--</span>
    </div>

    <div class="sensor-box">
        🌫️ <strong>Qualidade do Ar (MQ135):</strong> <span id="air-value">--</span>
    </div>

    <div class="sensor-box">
        🌧️ <strong>Chuva:</strong> <span id="rain-value">--</span>
    </div>

    <div id="recommendation" class="recommendation good">
        <p><span class="rec-icon">🌿</span> Carregando informações...</p>
    </div>

</div>

<footer>
    Sistema de Monitoramento — Desenvolvido pelo Rafa 😎
</footer>


<!-- ================== JAVASCRIPT COM THINGSPEAK ================== -->

<script>
    const channelID = 3172465;
    const readAPIKey = "XKB8931BGHSD7SRX";

    async function updateSensors() {
        try {
            const url = `https://api.thingspeak.com/channels/${channelID}/feeds.json?api_key=${readAPIKey}&results=1`;
            const response = await fetch(url);
            const json = await response.json();

            if (!json.feeds || json.feeds.length === 0) {
                throw new Error("Nenhum dado encontrado");
            }

            const data = json.feeds[0];

            const uv = parseFloat(data.field3) || 0;
            const air = parseFloat(data.field4) || 0;
            const rain = parseInt(data.field5) === 1 ? "Chovendo" : "Sem chuva";
            const temp = parseFloat(data.field1) || 0;
            const hum = parseFloat(data.field2) || 0;

            document.getElementById('uv-value').textContent = uv;
            document.getElementById('air-value').textContent = air;
            document.getElementById('rain-value').textContent = rain;
            document.getElementById('temp-value').textContent = temp;
            document.getElementById('hum-value').textContent = hum;

            // Recomendações
            let message = "";
            let className = "";
            let icon = "";

            if (rain === "Chovendo") {
                message = "Cuidado! Está chovendo no parque.";
                className = "warning";
                icon = "🌧️";
            } else if (air > 200) {
                message = "Qualidade do ar ruim! Evite esforços físicos.";
                className = "warning";
                icon = "🌫️";
            } else if (uv > 7) {
                message = "Índice UV alto! Use protetor solar.";
                className = "warning";
                icon = "☀️";
            } else {
                message = "Condições ótimas para aproveitar o parque!";
                className = "good";
                icon = "🌿";
            }

            const recDiv = document.getElementById('recommendation');
            recDiv.innerHTML = `<p><span class="rec-icon">${icon}</span> ${message}</p>`;
            recDiv.className = `recommendation ${className}`;

        } catch (error) {
            console.log("Erro:", error);
            document.getElementById('recommendation').innerHTML =
                '<p><span class="rec-icon">❌</span> Erro ao carregar dados.</p>';
        }
    }

    setInterval(updateSensors, 5000);
    updateSensors();
</script>

</body>
</html>
